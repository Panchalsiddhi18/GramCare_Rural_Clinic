{% extends 'base.html' %}{% block title %}Book Appointment | GramCare{% endblock %}{% block heading %}Book a clinic visit{% endblock %}{% block content %}<div class="form-card"><span class="eyebrow">SMART BOOKING</span><h2>Choose clinic and doctor</h2><p class="muted">Your token is generated automatically for today's queue.</p><form method="post" class="row g-3"><div class="col-md-6"><label>Clinic</label><select name="clinic_id" required>{% for c in clinics %}<option value="{{ c.id }}">{{ c.name }} — {{ c.taluka }}</option>{% endfor %}</select></div><div class="col-md-6"><label>Doctor</label><select name="doctor_id" required>{% for d in doctors %}<option value="{{ d.id }}">Dr. {{ d.user.full_name }} · {{ d.specialization }}</option>{% endfor %}</select></div><div class="col-md-6"><label>Preferred slot</label><select name="time_slot"><option>09:00 AM - 10:00 AM</option><option>10:00 AM - 11:00 AM</option><option>11:00 AM - 12:00 PM</option><option>02:00 PM - 03:00 PM</option></select></div><div class="col-12"><button class="btn btn-primary">Confirm appointment <i class="fa-solid fa-arrow-right"></i></button></div></form></div>{% endblock %}
